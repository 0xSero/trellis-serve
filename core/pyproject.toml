[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trellis-core"
version = "0.1.0"
description = "EXL3 checkpoint format reader and bit-exact PyTorch reference decoder, shared by the trellis-serve plugins"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy"]

[project.optional-dependencies]
reference = ["torch"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
